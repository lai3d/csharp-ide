name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # version number from git describe

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install csharp-ls
        run: |
          dotnet tool install --global csharp-ls
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          swift --version
          dotnet --info | head -20
          which csharp-ls

      - name: Build
        run: swift build

      # The netcoredbg end-to-end tests skip themselves when it isn't installed.
      - name: Test
        run: swift test

      - name: Bundle CSharpIDE.app
        run: ./scripts/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CSharpIDE-app
          path: build/CSharpIDE.zip
